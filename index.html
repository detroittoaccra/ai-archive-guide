<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Using AI for a Community Archive: Decision Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#17211E; --muted:#4E5D58; --line:#CBD5D0;
  --accent:#1D5A52; --accent-ink:#FFFFFF; --accent-soft:#DCEBE7; --ochre:#9A6A12;
  --go:#2E7A4C; --go-soft:#E0F0E6; --wait:#9A6400; --wait-soft:#FBF0D9; --stop:#A93A28; --stop-soft:#F8E3DE;
  --focus:#9A6A12;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A18; --surface:#1A2522; --ink:#E4ECE8; --muted:#A5B5AF; --line:#324440;
    --accent:#73BDB0; --accent-ink:#0E1A17; --accent-soft:#1F3833; --ochre:#E0B25A;
    --go:#6FCB93; --go-soft:#1C3325; --wait:#E8B24F; --wait-soft:#3A2F17; --stop:#F08A74; --stop-soft:#3D221C;
    --focus:#E0B25A;
  }
}
:root[data-theme="dark"]{
  --bg:#121A18; --surface:#1A2522; --ink:#E4ECE8; --muted:#A5B5AF; --line:#324440;
  --accent:#73BDB0; --accent-ink:#0E1A17; --accent-soft:#1F3833; --ochre:#E0B25A;
  --go:#6FCB93; --go-soft:#1C3325; --wait:#E8B24F; --wait-soft:#3A2F17; --stop:#F08A74; --stop-soft:#3D221C;
  --focus:#E0B25A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:1.0625rem;line-height:1.6}
.wrap{max-width:44rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1,h2,h3{line-height:1.2;margin:0 0 .6em}
h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.01em;max-width:18ch}
h2{font-size:clamp(1.5rem,4vw,2rem)}
h3{font-size:1.2rem;margin-top:1.8em}
p{margin:0 0 1em}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.lead{font-size:1.2rem;color:var(--muted);max-width:36rem}
.muted{color:var(--muted)}
.small{font-size:.92rem}

/* Trail (step path) */
.trail-box{overflow-x:auto;margin:0 -1.25rem 1.75rem;padding:0 1.25rem}
.trail{display:flex;list-style:none;margin:0;padding:.25rem 0;min-width:max-content}
.trail li{position:relative;flex:1 0 auto}
.trail li+li::before{content:"";position:absolute;top:1.05rem;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.trail li.done+li::before,.trail li.done.cur::before{background:var(--accent)}
.trail button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;
  background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;padding:0 .7rem;cursor:pointer;min-width:5.2rem}
.trail .node{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:3px solid var(--line);font-weight:700;font-size:.9rem;color:var(--muted)}
.trail li.done .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trail li.cur .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.trail li.cur button{color:var(--ink);font-weight:700}

/* Intro */
.hero{padding:1rem 0 1.5rem}
.facts{display:grid;gap:0;margin:2rem 0;border-top:2px solid var(--ink)}
.fact{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.fact h3{margin:0;font-size:1.05rem}
.fact p{margin:0}
@media (max-width:560px){.fact{grid-template-columns:1fr;gap:.25rem}}
.habits{margin:.5rem 0 0;padding-left:1.2rem}
.habits li{margin:.2rem 0}
.how{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem 1.25rem .5rem;margin:2rem 0}
.how ol{padding-left:1.3rem;margin:.5rem 0 1rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin:1.5rem 0}
.btn{appearance:none;font:inherit;font-weight:700;font-size:1rem;padding:.8rem 1.35rem;border-radius:8px;cursor:pointer;
  border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;padding-left:.4rem;padding-right:.4rem}
.btn:disabled{opacity:.5;cursor:default}

/* Questions */
.count{color:var(--muted);font-size:.95rem;margin-bottom:.3rem}
.q{margin:2rem 0 0;padding-top:1.5rem;border-top:1px solid var(--line)}
.q[hidden]{display:none}
.q.follow{margin-top:1rem;padding:1rem 1rem .25rem;border:0;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.qlabel{display:block;font-weight:700;font-size:1.15rem;margin-bottom:.6rem;padding:0;line-height:1.35}
.qhint{color:var(--muted);font-size:.95rem;margin:-.3rem 0 .6rem}
details.why{margin:0 0 .8rem;font-size:.95rem}
details.why summary{cursor:pointer;color:var(--accent);font-weight:700;width:max-content;max-width:100%}
details.why p{margin:.5rem 0 0;padding:.75rem 1rem;background:var(--accent-soft);border-radius:8px}
.learn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.learn h3{margin:0 0 .5rem;font-size:1.3rem}
.learn p{margin:0 0 .6rem}
.learn .ex{color:var(--muted);font-style:italic}
.learn .odds{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .8rem;padding:0;list-style:none}
.learn .odds li{font-size:.88rem;padding:.25rem .6rem;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.learn .odds b{font-weight:700}
.learn h4{margin:.6rem 0 .2rem;font-size:1rem}
.learn ul.reduce{margin:0;padding-left:1.2rem}
.learn ul.reduce li{margin:.2rem 0}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;padding:.8rem 1rem;background:var(--surface);
  border:2px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:1.3rem;height:1.3rem;margin:.15rem 0 0;flex:none;accent-color:var(--accent)}
.opt .ol{display:flex;flex-direction:column}
.opt .note{color:var(--muted);font-size:.9rem;margin-top:.15rem}
input[type=text]{width:100%;font:inherit;padding:.75rem .9rem;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:48px}
input[type=text]:focus{border-color:var(--accent)}
.flags:empty{display:none}
.flags{margin-top:.75rem;display:grid;gap:.5rem}
.flag{padding:.7rem 1rem;border-radius:8px;border-left:5px solid;font-size:.97rem}
.flag b{display:block;margin-bottom:.1rem}
.flag.stop{background:var(--stop-soft);border-color:var(--stop)}
.flag.caution{background:var(--wait-soft);border-color:var(--wait)}
.flag.ok{background:var(--go-soft);border-color:var(--go)}
.navrow{display:flex;justify-content:space-between;gap:.75rem;margin-top:2.5rem;padding-top:1.25rem;border-top:2px solid var(--ink)}

/* Results */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:1.25rem;align-items:center;margin:1rem 0 2rem;
  padding:1.5rem;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.lights{display:flex;flex-direction:column;gap:.45rem;padding:.6rem;border-radius:999px;background:var(--ink)}
.lights span{width:2.2rem;height:2.2rem;border-radius:50%;background:#3a4643;opacity:.55}
.lights .r.on{background:#E0583F;opacity:1;box-shadow:0 0 14px #E0583F}
.lights .a.on{background:#F0AE33;opacity:1;box-shadow:0 0 14px #F0AE33}
.lights .g.on{background:#3FB36A;opacity:1;box-shadow:0 0 14px #3FB36A}
.verdict h2{margin:0 0 .3rem}
.verdict p{margin:0}
.issue-list{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.5rem}
.sheet-box{margin-top:1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:32rem;overflow:auto}
.sheet{padding:1.5rem;font-size:.95rem}
.sheet h1{font-size:1.5rem;max-width:none}
.sheet h2{font-size:1.15rem;margin-top:1.6em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.sheet h4{margin:.9em 0 .2em;font-size:1rem}
.sheet ul,.sheet ol{padding-left:1.3rem}
.sheet li{margin:.25rem 0}
.sheet dl{display:grid;grid-template-columns:minmax(9rem,max-content) 1fr;gap:.2rem 1rem;margin:0}
.sheet dt{font-weight:700}
.sheet dd{margin:0}
.status{min-height:1.5em;font-size:.95rem;color:var(--muted)}
.foot{margin-top:3rem;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem}
@media (prefers-reduced-motion:no-preference){
  .lights span.on{animation:glow .6s ease-out 1}
  @keyframes glow{from{opacity:.4;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
}
@media print{
  body{background:#fff;color:#000}
  .trail-box,.btns,.navrow,.status,.foot{display:none}
  .sheet-box{max-height:none;border:0}
}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="off"></main>

<script>
(function(){
"use strict";

/* ---------- Content: steps and questions ---------- */
function taskAny(a,l){ var t=a.tasks||[], real=t.filter(function(x){return x!=="advice";});
  if(!real.length||t.indexOf("advice")>-1) return true; return l.some(function(x){return t.indexOf(x)>-1;}); }
function notAgainst(a){ return a.discussed!=="against"; }
function fullPath(a){ return a.discussed!=="against"&&a.discussed!=="not"; }
function topic(id,title,L,na,show){
  var o=[{v:"ok",l:"We understand this and know how we will handle it"},
         {v:"discuss",l:"We need to discuss this more",flag:["caution","Discuss '"+title+"' as a group before starting."]}];
  if(na) o.push({v:"na",l:na});
  return {id:id,type:"single",topicTitle:title,learn:L,show:show,label:"Where does your group stand on this?",opts:o};
}
var STEPS = [
{ id:"about", title:"About you and the project", short:"You",
  intro:"A few details to label your project brief. Leave blank anything you prefer not to share.",
  qs:[
  {id:"role", type:"single", label:"Which best describes you?", opts:[
    {v:"community", l:"A community member or community organisation"},
    {v:"institution", l:"A library, archive or museum working with a community"},
    {v:"researcher", l:"A researcher working with a community (for example, in the humanities)"},
    {v:"other", l:"Something else"}]},
  {id:"agreement", type:"single", follow:true, show:function(a){return a.role==="researcher"||a.role==="institution";},
    label:"Is there a written agreement with the community about who owns and controls the material?",
    why:"Many Indigenous communities follow data sovereignty principles such as CARE (Collective benefit, Authority to control, Responsibility, Ethics) or, in Canada, OCAP\u00AE (Ownership, Control, Access, Possession). An agreement should say who owns the material, who decides how it is used, and what happens to copies when the project ends.",
    opts:[
    {v:"yes", l:"Yes, signed or formally agreed", flag:["ok","Good. The brief will note that an agreement is in place."]},
    {v:"drafting", l:"It is being drafted", flag:["caution","Finish the agreement before any material is processed with AI."]},
    {v:"no", l:"No", flag:["stop","An agreement on ownership and control comes first. No material should be processed until the community has agreed in writing."]}]},
  {id:"project", type:"text", label:"Project name", ph:"For example: River Valley Oral History Archive"},
  {id:"org", type:"text", label:"Community or organisation (optional)"},
  {id:"contact", type:"text", label:"Contact person for the developer (optional)"}
  ]},
{ id:"agree", title:"Community agreement", short:"Agreement",
  intro:"The community should decide about AI together, before any material is uploaded. You are allowed to say no, not yet, or only for this part.",
  qs:[
  {id:"discussed", type:"single", label:"Has the community discussed using AI and agreed to try it?", opts:[
    {v:"agreed", l:"Yes, we have agreed to try it", flag:["ok","Good. Record who agreed and when."]},
    {v:"underway", l:"The discussion is under way", flag:["caution","Keep planning, but wait for agreement before any material goes into an AI tool."]},
    {v:"not", l:"Not yet", flag:["stop","Start with a community conversation. The guide will now take a shorter path and end with a discussion pack to help you run it."]},
    {v:"against", l:"The community has decided against it", flag:["stop","That is a legitimate decision. The guide will skip the AI-specific steps and produce a brief for archive work that does not use AI."]}]},
  {id:"authority", type:"text", label:"Who has authority to approve decisions about the archive? (optional)", ph:"For example: council, elders, board, family representatives"},
  {id:"partners", type:"single", show:function(a){return a.role!=="researcher"&&a.role!=="institution";},
    label:"Are outside researchers or institutions involved in the project?", opts:[
    {v:"yes", l:"Yes", flag:["ok","The guide will add a step on partnership terms."]},
    {v:"no", l:"No"},
    {v:"maybe", l:"Possibly in future"}]},
  {id:"consent", type:"single", label:"Have the people who contributed material, or their families, agreed to AI being used on it?",
    why:"People who shared recordings or photos years ago agreed to an archive, not to AI. Consent may need to be asked again, in their own language. Some consent is collective: families, clans or councils may need to agree, not just one person.",
    opts:[
    {v:"all", l:"Yes, for all of it"},
    {v:"some", l:"For some of it", flag:["caution","Only material with consent should be considered for AI. The rest is handled by people only."]},
    {v:"notasked", l:"We have not asked yet", flag:["caution","Plan how to ask, in local languages, before any processing."]},
    {v:"unsure", l:"Not sure"}]},
  {id:"protocols", type:"single", label:"Are there cultural protocols about who may see or hear certain material?",
    why:"Some knowledge is restricted by gender, age, season, family or ceremony. AI tools do not understand this unless it is built into the system.",
    opts:[
    {v:"written", l:"Yes, and they are written down"},
    {v:"unwritten", l:"Yes, but they are not written down", flag:["caution","Protocols need to be recorded in a form the system can follow before any automated processing."]},
    {v:"no", l:"No"},
    {v:"unsure", l:"Not sure"}]}
  ]},
{ id:"prepare", title:"Preparing for a community conversation", short:"Prepare", show:function(a){return a.discussed==="not";},
  intro:"Your community has not discussed AI yet, so the next step is a conversation, not technology. These questions help you plan it. The guide will skip the technical steps and end with a discussion pack.",
  qs:[
  {id:"c_who", type:"multi", label:"Who should be part of the conversation?", hint:"Choose all that apply.", opts:[
    {v:"elders", l:"Elders and knowledge holders"},
    {v:"council", l:"Council, board or other decision-makers"},
    {v:"families", l:"Families of people whose stories or images are in the archive"},
    {v:"youth", l:"Young people"},
    {v:"gender", l:"Holders of gender-specific knowledge"},
    {v:"lesstech", l:"People less comfortable with technology"},
    {v:"staff", l:"Archive staff and volunteers"},
    {v:"partners", l:"Outside partners (researchers, institutions)"}]},
  {id:"c_lead", type:"text", label:"Who will host or lead the conversation? (optional)"},
  {id:"c_lang", type:"text", label:"Which languages should the conversation happen in?"},
  {id:"c_when", type:"single", label:"Has a time and place been set?", opts:[{v:"yes", l:"Yes"},{v:"no", l:"Not yet"}]},
  {id:"c_examples", type:"single", label:"Would you like to show real examples of AI output, including its mistakes?",
    why:"Seeing actual results, good and bad, helps people judge AI honestly rather than from hopes or fears.",
    opts:[{v:"yes", l:"Yes, we will prepare some"},{v:"no", l:"No"},{v:"unsure", l:"Not sure how"}]},
  {id:"c_pay", type:"single", label:"Will people be paid or thanked for their time and expertise?", opts:[{v:"yes", l:"Yes"},{v:"no", l:"No"},{v:"undecided", l:"Not decided"}]}
  ]},
{ id:"partner", title:"Partnership terms", short:"Partnership",
  show:function(a){return notAgainst(a)&&(a.role==="researcher"||a.role==="institution"||a.partners==="yes");},
  intro:"When researchers or institutions are involved, agree up front who owns what, who benefits, and what happens when the project ends. These points are central to data sovereignty principles such as CARE and OCAP\u00AE.",
  qs:[
  {id:"p_outputs", type:"single", label:"Who will own what the project produces, such as transcripts, translations, datasets, publications and any AI tools trained on the material?", opts:[
    {v:"community", l:"The community owns and controls all of it"},
    {v:"shared", l:"Shared, under a written agreement the community has approved"},
    {v:"institution", l:"The researcher or institution", flag:["caution","Community ownership or control of outputs is a core data sovereignty principle. Revisit this before any processing."]},
    {v:"notyet", l:"Not yet agreed", flag:["caution","Agree ownership of outputs, including any AI tools or datasets, before starting."]}]},
  {id:"p_review", type:"single", label:"Will the community review publications, presentations and datasets before they are shared?", opts:[
    {v:"yes", l:"Yes"},
    {v:"notyet", l:"Not yet agreed", flag:["caution","Agree a community review step before anything is published or shared."]}]},
  {id:"p_benefit", type:"multi", label:"How will the community benefit?", hint:"Choose all that apply.", opts:[
    {v:"pay", l:"Payment for time and expertise"},
    {v:"skills", l:"Training and skills"},
    {v:"access", l:"Copies of, and access to, everything produced"},
    {v:"funding", l:"A share of funding"},
    {v:"credit", l:"Credit or co-authorship"},
    {v:"notyet", l:"Not yet discussed", flag:["caution","Discuss how the community will benefit, on its own terms."]}]},
  {id:"p_ethics", type:"single", show:function(a){return a.role==="researcher"||a.role==="institution";},
    label:"Has the project had ethics approval?",
    why:"Institutional ethics review (such as a research ethics board or institutional review board) protects research participants, but it does not replace a community's own approval process.",
    opts:[
    {v:"both", l:"Yes: institutional and community approval"},
    {v:"inst", l:"Institutional approval only", flag:["caution","Seek the community's own approval too; institutional review does not replace it."]},
    {v:"notyet", l:"Not yet", flag:["caution","Obtain institutional and community approval before starting."]},
    {v:"na", l:"Not applicable"}]},
  {id:"p_end", type:"single", label:"What happens to copies and data when the project ends?", opts:[
    {v:"decide", l:"Returned or deleted as the community decides"},
    {v:"kept", l:"Kept by the institution under a written agreement"},
    {v:"notyet", l:"Not yet agreed", flag:["caution","Agree what happens to all copies, including any held by AI providers, when the project ends."]}]}
  ]},
{ id:"material", title:"Your material", short:"Material",
  intro:"What you have decides what AI can safely touch.",
  qs:[
  {id:"types", type:"multi", label:"What kinds of material are in the archive?", hint:"Choose all that apply.", opts:[
    {v:"av", l:"Audio or video recordings"},
    {v:"photos", l:"Photographs"},
    {v:"hand", l:"Handwritten documents"},
    {v:"print", l:"Printed documents, newsletters or books"},
    {v:"land", l:"Maps, land or legal records"},
    {v:"lang", l:"Language materials (word lists, lessons, dictionaries)"},
    {v:"objects", l:"Objects or artworks"},
    {v:"digital", l:"Born-digital material (emails, social media, websites)"}]},
  {id:"languages", type:"text", label:"Which languages appear in the material?", ph:"For example: English, Kriol, Spanish, Quechua"},
  {id:"volume", type:"single", label:"Roughly how much material is there?", opts:[
    {v:"small", l:"Small: a few hundred items, or under 50 hours of recordings"},
    {v:"medium", l:"Medium: thousands of items, or hundreds of hours"},
    {v:"large", l:"Large: tens of thousands of items or more"},
    {v:"unsure", l:"Not sure"}]},
  {id:"sensitive", type:"multi", label:"Does any of the material include the following?", hint:"Choose all that apply.",
    why:"These kinds of material are 'red light': they should be kept away from AI entirely and handled by people only, under community protocols.",
    opts:[
    {v:"sacred", l:"Sacred, ceremonial or restricted knowledge", flag:["caution","Sacred and restricted material must be kept out of AI tools entirely."]},
    {v:"personal", l:"Personal or health information about living people", flag:["caution","Personal information must be kept out of AI tools, or removed first."]},
    {v:"locations", l:"Locations of sacred sites, graves or resources", flag:["caution","Location details must be kept out of AI tools and out of public search."]},
    {v:"legal", l:"Land claims or legal matters", flag:["caution","Legal and land-claim material must be kept out of AI tools."]},
    {v:"children", l:"Material about children", flag:["caution","Material about children must be kept out of AI tools."]},
    {v:"none", l:"None of these"},
    {v:"unsure", l:"Not sure", flag:["caution","Check with knowledge holders before any processing."]}]},
  {id:"sorted", type:"single", label:"Have you sorted the material into access levels?",
    why:"For example: open to all; community only; family or clan only; knowledge holders only; never digitised. A traffic-light approach helps: green is already public, yellow is community only, red is restricted or sacred.",
    opts:[
    {v:"yes", l:"Yes"},
    {v:"partly", l:"Partly", flag:["caution","Only fully sorted material should go anywhere near AI."]},
    {v:"no", l:"No", flag:["stop","Sort material into access levels before using AI. Otherwise restricted items may be processed by accident."]}]},
  {id:"originals", type:"single", label:"Do you keep complete copies of the originals that you control?", opts:[
    {v:"multiple", l:"Yes, at least two copies, one of them offline"},
    {v:"one", l:"One copy only", flag:["caution","Make a second copy, kept offline, before any processing."]},
    {v:"no", l:"No", flag:["stop","Secure your own copies first. Never rely on an AI provider or website to hold the only copy."]}]}
  ]},
{ id:"tasks", title:"What AI would do", short:"Tasks", show:fullPath,
  intro:"Choose only the tasks where AI would save real effort. The note under each one says how well it tends to work.",
  qs:[
  {id:"tasks", type:"multi", label:"What would you like AI to help with?", hint:"Choose all that apply.", opts:[
    {v:"transcribe", l:"Transcribe audio and video", n:"Fast for major languages. Struggles with minority languages, accents, elders' voices and noisy recordings."},
    {v:"ocr", l:"Turn scanned documents into searchable text (OCR)", n:"Works well on clean print. Misreads handwriting, faded pages and special characters."},
    {v:"translate", l:"Translate between languages", n:"Rough drafts only. Poor or unavailable for many local languages."},
    {v:"describe", l:"Suggest descriptions and tags for photos and objects", n:"Guesses names, places and meanings, and may apply outside or offensive labels."},
    {v:"summarise", l:"Summarise and add keywords", n:"Can flatten stories, skip parts of long recordings and add details that are not there."},

{ id:"risks", title:"Understand the risks", short:"Risks", show:notAgainst,
  intro:"Each risk below says what it is, how likely it is, and how to reduce it. Most are very preventable: they come mainly from how AI is used, not from AI itself. Read each one together, then say where your group stands.",
  qs:[
  topic("r_halluc","Made-up content (hallucinations)",{means:"AI states false things confidently, with no warning.",ex:"A summary says an elder was born in a village she never lived in; a translation invents the meaning of a ceremony.",odds:["Almost certain on any large job","Rare to reach the archive","Medium to high: false facts can last for generations"],reduce:["A knowledgeable community member checks every output before it is saved.","Label AI-made text clearly so mistakes are not taken as fact."]}),
  topic("r_leak","Leaks and exposure",{means:"Private or sacred material ends up where it should not. This usually happens through human error, not hacking.",ex:"Someone pastes a restricted recording into a free online AI tool, or a search tool shows restricted items to the public.",odds:["Possible","Low","High for sacred or personal material"],reduce:["Agree clear rules on what may be uploaded, and by whom.","Use offline or local tools for anything sensitive.","A simple rule: if you would not post it on a public noticeboard, do not put it into a public AI tool."]}),
  topic("r_train","Your material used to train AI",{means:"The company keeps your material and uses it to build its products.",ex:"Your language or stories end up inside a commercial AI product.",odds:["Likely on many free tools","Low","High for cultural and language material"],reduce:["On most free and personal accounts, chats can be used for training unless you switch it off. Before uploading anything, turn off settings such as 'Improve the model for everyone' (ChatGPT), 'Help improve Claude' (Claude) or 'Keep Activity' (Gemini).","Switching it off protects future chats only, not past ones, and every person's account must be changed separately.","Business, education, nonprofit and developer (API) accounts often do not train on your data by default. Check the terms, and recheck regularly, because companies change them."]}),
  topic("r_bias","Bias and misrepresentation",{means:"AI repeats outside or colonial views of your community.",ex:"Photos labelled with offensive historic terms, or your people described as 'extinct'.",odds:["Likely","Low","Medium: hurtful and misleading"],reduce:["People review every description.","Use your community's own words and labels."]},null,function(a){return taskAny(a,["describe","summarise","translate","search"]);}),
  topic("r_meaning","Loss of meaning and protocols",{means:"Stories are reduced to keywords, and cultural rules are ignored.",ex:"Seasonal or gender-restricted knowledge becomes searchable by anyone.",odds:["Likely","Low","Medium to high for restricted knowledge"],reduce:["Knowledge holders decide what AI may touch.","Record protocols alongside each item."]},null,function(a){return taskAny(a,["describe","summarise","translate","search"])||a.protocols==="written"||a.protocols==="unwritten";}),
  topic("r_control","Ownership, dependency and cost",{means:"You cannot get your material back, or the archive only works while a company's tool exists and you can pay for it.",ex:"Prices rise, a free version ends, or the company closes.",odds:["Likely within 3 to 5 years","Still likely, but harmless if prepared","Low if you keep your own copies"],reduce:["Keep your own full copies of originals.","Use open file formats, and make sure the archive works without AI.","Get written agreements on ownership, deletion and where material is stored."]}),
  topic("r_harm","Surveillance and harm",{means:"Information is used against community members.",ex:"Locations of sacred sites, land claims or activists become easy to find.",odds:["Unlikely","Very low","Very high"],reduce:["Keep red-light material out of AI entirely.","Think about who might want this information, and why."]},null,function(a){return taskAny(a,["search","website"])||(a.sensitive||[]).some(function(x){return ["sacred","personal","locations","legal","children"].indexOf(x)>-1;});})
  ]},
{ id:"works", title:"How well AI actually works", short:"Limits", show:fullPath,
  intro:"AI often looks impressive in a demonstration but works less well on real community material. These limits are built into how today's AI works, so they affect every tool to some degree.",
  qs:[
  topic("e_context","Limited memory (context drop)",{means:"AI can only hold a certain amount of material in mind at once. With long material it forgets or skims parts, often the middle.",ex:"A summary of a three-hour oral history leaves out the most important story.",reduce:["Break long recordings and documents into shorter pieces.","Check summaries against the full item."]},null,function(a){return taskAny(a,["transcribe","summarise","search","translate","ocr"]);}),
  topic("e_lang","Language gaps and errors that add up",{means:"AI learns mostly from English and a few big languages. When text is generated in stages (transcribe, then translate, then summarise), each stage adds its own mistakes.",ex:"By the end of the chain, the meaning of a story may be badly wrong, with invented details that look like fact.",reduce:["Test each language on a sample.","Check each stage before starting the next.","Budget for human correction."]},null,function(a){return taskAny(a,["transcribe","translate","ocr","summarise"]);}),
  topic("e_collapse","Model collapse",{means:"When AI learns from content that other AI produced, its quality slowly gets worse. Rare words, dialects and unusual stories fade first.",ex:"If unchecked AI text fills the archive, future tools trained on it inherit and magnify the errors.",reduce:["Keep human-made and AI-made content clearly separate and labelled.","Never treat unchecked AI text as the original record."]},null,function(a){return taskAny(a,["transcribe","ocr","translate","describe","summarise","search"]);}),
  topic("e_change","Inconsistency, changing tools and over-trust",{means:"The same question can get different answers; companies update tools without warning; AI rarely says 'I don't know'. People also tend to trust computers too much, especially when busy.",ex:"A process that worked last year gives different results now, and reviewers stop checking carefully after a few good results.",reduce:["Test on 10 to 20 items you know well: advertised accuracy may not apply to your material.","Retest after updates and at each community review.","Rotate reviewers or take breaks so checking stays careful."]}),
  topic("e_long","Long projects that go beyond a single chat",{means:"Chat tools usually do not remember earlier conversations, and long chats lose track of details from the start.",ex:"Naming rules or access decisions agreed in March are ignored in May.",reduce:["Keep your own written record of key decisions and instructions, and share it at the start of each session.","Do not rely on chat history as your only record of the work.","For technical work, agentic tools (such as Claude Code or Codex) can keep track across sessions, but they change files directly. Use them only on a copy, with backups, never on folders with restricted material, and with someone who can review their changes."]},"Not relevant: our use will be short, one-off tasks"),
  topic("e_web","Using AI to build or fix the website",{means:"AI can expose passwords or personal data pasted into it, and its quick fixes can weaken security or make restricted material public.",ex:"A 'permission denied' error is 'fixed' by making every folder open to everyone.",reduce:["Remove passwords, keys and personal details before pasting anything.","Test changes on a copy of the site, with a recent backup.","Have a person review any change affecting logins or who can see what.","After changes, check the site as a visitor, a community member and an admin."]},null,function(a){return has(a.tasks,"website");}),
  topic("e_env","Environmental cost",{means:"AI runs in data centres that use electricity and water. For a community archive the impact is usually modest, and your choices make a real difference.",ex:"Costs are highest with very large tools, image or video generation, and re-running the same task. Some data centres are in water-scarce regions, including in the Global South.",reduce:["Use smaller tools, and run them locally where possible.","Do each task once, well, and work in batches.","Skip AI images and video unless they serve a clear purpose.","Ask providers about their energy and water use."]})
  ]},

/* ---------- State ---------- */
var KEY="aiArchiveGuide.v1";
var A={}, view="intro", stepIdx=0;
function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var o=JSON.parse(s); A=o.A||{}; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({A:A})); }catch(e){} }
function clearAll(){ A={}; try{ localStorage.removeItem(KEY); }catch(e){} }
function has(arr,v){ return Array.isArray(arr)&&arr.indexOf(v)>-1; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
STEPS.forEach(function(st){ st.qs.forEach(function(q){ q.step=st; }); });
function stepOn(st){ return !st.show||st.show(A); }
function act(){ return STEPS.filter(stepOn); }
function visible(q){ return (!q.step||stepOn(q.step)) && (!q.show || q.show(A)); }
function allQs(){ var o=[]; STEPS.forEach(function(s){ s.qs.forEach(function(q){ o.push(q); }); }); return o; }
function Q(id){ return allQs().filter(function(q){return q.id===id;})[0]; }
function optL(id,v){ var q=Q(id); if(!q||!q.opts) return v; var o=q.opts.filter(function(x){return x.v===v;})[0]; return o?o.l:v; }
function val(id){ var q=Q(id); if(!q||!visible(q)) return undefined; return A[id]; }
function hasAnswers(){ return Object.keys(A).some(function(k){ var v=A[k]; return Array.isArray(v)?v.length:!!v; }); }

var app=document.getElementById("app");

/* ---------- Rendering ---------- */
function trail(){
  var items=act().map(function(s,i){
    var cls=(view==="step"&&i===stepIdx?"cur ":"")+((view==="results"||(view==="step"&&i<stepIdx))?"done":"");
    return '<li class="'+cls+'"><button type="button" data-go="'+i+'"'+(view==="step"&&i===stepIdx?' aria-current="step"':'')+'><span class="node">'+(i+1)+'</span>'+esc(s.short)+'</button></li>';
  });
  items.push('<li class="'+(view==="results"?"cur done":"")+'"><button type="button" data-go="results"'+(view==="results"?' aria-current="step"':'')+'><span class="node">\u2713</span>'+(A.discussed==="not"?"Pack":"Brief")+'</button></li>');
  return '<nav class="trail-box" aria-label="Guide steps"><ol class="trail">'+items.join("")+'</ol></nav>';
}

function renderIntro(){
  var resume=hasAnswers();
  app.innerHTML =
  '<section class="hero">'+
  '<h1>Should we use AI to build our archive?</h1>'+
  '<p class="lead">A guide for communities, archives and researchers deciding whether and how to use AI with community records. Work through the questions together, then download a project brief to share with a developer.</p>'+
  '<div class="btns">'+
    (resume?'<button class="btn" data-act="resume">Continue where you left off</button><button class="btn ghost" data-act="restart">Start again</button>'
           :'<button class="btn" data-act="start">Start the guide</button>')+
  '</div></section>'+
  '<div class="facts">'+
   '<div class="fact"><h3>What AI can do</h3><p>Transcribe recordings, read scanned documents, suggest descriptions, draft translations and make large collections searchable, much faster than by hand.</p></div>'+
   '<div class="fact"><h3>What it cannot do</h3><p>Decide what is sacred, private or appropriate to share, or who has the right to tell a story. Those decisions stay with people.</p></div>'+
   '<div class="fact"><h3>How well it works</h3><p>AI makes confident mistakes, loses track of long material, works poorly in many local languages, and changes when companies update it. Someone always has to check its work.</p></div>'+
   '<div class="fact"><h3>How risky it is</h3><p>For a community that follows a few basic habits, a moderate, manageable risk. Serious harms, like leaks of sacred material, are rare and are prevented by keeping restricted material away from AI. Common problems, like errors and bias, will appear, but careful checking stops them from entering the archive.</p></div>'+
   '<div class="fact"><h3>Habits that prevent most problems</h3><div><ul class="habits">'+
     '<li>Keep restricted and sacred material out of AI tools completely.</li>'+
     '<li>Have a knowledgeable person check everything before it is saved.</li>'+
     '<li>Keep your own full copies of the originals.</li>'+
     '<li>Use tools that promise in writing not to reuse your material.</li>'+
     '<li>Label AI-made content clearly.</li></ul></div></div>'+
   '<div class="fact"><h3>Doing nothing has risks too</h3><p>Tapes and photos decay, elders pass on, and backlogs can take decades by hand. The aim is not to avoid all risk, but to choose the risks you can manage.</p></div>'+
  '</div>'+
  '<div class="how"><h2 style="font-size:1.35rem">How this guide works</h2>'+
   '<ol><li>Work through short steps about your community, your material, the risks and your options. The steps adapt to your answers: if your community has not discussed AI yet, you take a shorter path that ends in a discussion pack; researchers and institutions get questions on partnership terms; and you only see limits that apply to the tasks you choose.</li>'+
   '<li>For each risk and limit, read a plain explanation of how likely it is and how to reduce it, then say where your group stands. Notes appear as you answer, flagging anything to address first.</li>'+
   '<li>At the end you get a readiness result, and either a project brief written as clear requirements a developer can act on, or a discussion pack for your community conversation.</li></ol>'+
   '<p class="small muted">It takes about 20 to 60 minutes, depending on your path, and works best in a group, perhaps over more than one meeting. Your answers are kept only in this browser so you can come back later; nothing is sent anywhere.</p></div>'+
  '<p class="foot">This guide supports community decision-making. It does not replace legal advice or your community\u2019s own processes.</p>';
}

function qHTML(q){
  var vis=visible(q);
  var h='<div class="q'+(q.follow?' follow':'')+'" data-q="'+q.id+'"'+(vis?'':' hidden')+'>';
  var why=q.why?'<details class="why"><summary>Why this matters</summary><p>'+esc(q.why)+'</p></details>':'';
  if(q.type==="text"){
    h+='<label class="qlabel" for="f_'+q.id+'">'+esc(q.label)+'</label>'+why+
       '<input type="text" id="f_'+q.id+'" name="'+q.id+'" value="'+esc(A[q.id]||"")+'" placeholder="'+esc(q.ph||"")+'" autocomplete="off">';
  } else {
    var t=q.type==="multi"?"checkbox":"radio";
    if(q.learn){ var L=q.learn;
      h+='<div class="learn"><h3>'+esc(q.topicTitle)+'</h3><p>'+esc(L.means)+'</p><p class="ex">Example: '+esc(L.ex)+'</p>'+
        (L.odds?'<ul class="odds"><li><b>If careless:</b> '+esc(L.odds[0])+'</li><li><b>With precautions:</b> '+esc(L.odds[1])+'</li><li><b>Harm if it happens:</b> '+esc(L.odds[2])+'</li></ul>':'')+
        '<h4>How to reduce it</h4><ul class="reduce">'+L.reduce.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'; }
    h+='<fieldset><legend>'+esc(q.label)+'</legend>'+(q.hint?'<p class="qhint">'+esc(q.hint)+'</p>':'')+why+'<div class="opts">';
    q.opts.forEach(function(o){
      var chk=q.type==="multi"?has(A[q.id],o.v):A[q.id]===o.v;
      h+='<label class="opt"><input type="'+t+'" name="'+q.id+'" value="'+o.v+'"'+(chk?' checked':'')+'><span class="ol"><span>'+esc(o.l)+'</span>'+(o.n?'<span class="note">'+esc(o.n)+'</span>':'')+'</span></label>';
    });
    h+='</div><div class="flags" aria-live="polite">'+flagsHTML(q)+'</div></fieldset>';
  }
  return h+'</div>';
}
var FLAGHEAD={stop:"Address this first",caution:"Worth attention",ok:"On track"};
function selectedFlags(q){
  if(!q.opts) return [];
  var sel=q.type==="multi"?(A[q.id]||[]):(A[q.id]?[A[q.id]]:[]);
  return q.opts.filter(function(o){return o.flag&&sel.indexOf(o.v)>-1;}).map(function(o){return {lvl:o.flag[0],text:o.flag[1],q:q};});
}
function flagsHTML(q){
  return selectedFlags(q).map(function(f){return '<div class="flag '+f.lvl+'"><b>'+FLAGHEAD[f.lvl]+'</b>'+esc(f.text)+'</div>';}).join("");
}

var curStep=null;
function skipNote(st){
  var hid=st.qs.filter(function(q){return q.learn&&q.show&&!q.show(A);});
  if(!hid.length) return "";
  return '<p class="flag ok small" style="margin-top:2rem"><b>Not shown</b>These topics do not apply to the tasks and material you chose: '+esc(hid.map(function(q){return q.topicTitle;}).join("; "))+'. To see them, go back to Tasks and add tasks or choose \u2018Not sure yet\u2019.</p>';
}
function navHTML(){ var n=act().length; return '<button class="btn ghost" data-act="back">Back</button><button class="btn" data-act="next">'+(stepIdx===n-1?"See your results":"Continue")+'</button>'; }
function renderStep(){
  var steps=act(); if(stepIdx>=steps.length) stepIdx=steps.length-1;
  var s=steps[stepIdx]; curStep=s;
  app.innerHTML=trail()+

function analyse(){
  var stops=[],cautions=[];
  allQs().forEach(function(q){ if(!visible(q)) return; selectedFlags(q).forEach(function(f){ if(f.lvl==="stop") stops.push(f); else if(f.lvl==="caution") cautions.push(f); }); });
  var v;
  if(A.discussed==="against") v="decided";
  else if(A.discussed==="not") v="prepare";
  else if(stops.length) v="notyet";
  else if(A.tested==="good"&&!cautions.length&&A.discussed==="agreed") v="expand";
  else v="trial";
  return {v:v,stops:stops,cautions:cautions};
}

   (r.v==="prepare"?'<h3>Your discussion pack</h3><p class="muted">An agenda, the main risks in plain language, and questions for your community conversation.</p>':'<h3>Your project brief</h3><p class="muted">Written as clear requirements for a developer. Share it with the community first.</p>')+
   '<div class="btns"><button class="btn" data-act="pdf">'+(r.v==="prepare"?"Download discussion pack (PDF)":"Download brief (PDF)")+'</button><button class="btn ghost" data-act="md">Download editable text (.md)</button><button class="btn plain" data-act="showtext">Show as text to copy</button></div>'+
   '<div id="textbox" hidden><label class="qlabel" for="bt">Brief as text</label><p class="qhint">Select all the text below and copy it into an email or document.</p><textarea id="bt" readonly style="width:100%;min-height:16rem;font:inherit;font-size:.9rem;padding:.75rem;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)"></textarea></div>'+
   '<p class="status" id="status" role="status"></p>'+
   '<div class="sheet-box"><div class="sheet" id="sheet">'+briefHTML(B)+'</div></div>'+
   '<div class="btns"><button class="btn ghost" data-act="edit">Change answers</button><button class="btn plain" data-act="restart">Start again</button></div></section>';
}

function render(focus){
  if(view==="intro") renderIntro(); else if(view==="step") renderStep(); else renderResults();
  window.scrollTo(0,0);
  var cur=app.querySelector('.trail li.cur'), tb=app.querySelector('.trail-box'); if(cur&&tb) tb.scrollLeft=cur.offsetLeft-tb.clientWidth/2+cur.offsetWidth/2;
  if(focus){ var h=document.getElementById("stepHead"); if(h) h.focus({preventScroll:true}); }
}

/* ---------- Downloads ---------- */
var dlP=null;
function getDL(){ if(!dlP&&window.claude&&typeof window.claude.use==="function"){ dlP=window.claude.use("downloads").catch(function(){return null;}); } return dlP||Promise.resolve(null); }
function status(t){ var s=document.getElementById("status"); if(s) s.textContent=t; }
function saveFile(name,data,mime){
  return getDL().then(function(dl){
    if(dl){
      return dl.save({filename:name,data:data}).then(function(){status("Saved.");},function(e){
        var c=e&&e.code;
        if(c==="declined") status("Download cancelled.");
        else if(c==="rate_limited") status("A download prompt is already open. Try again in a moment.");
        else status("Downloads are not available in this view. You can select the brief text below and copy it instead.");
      });
    }
    if(window.claude){ status("Downloads are not available in this view. You can select the brief text below and copy it instead."); return; }
    var blob=data instanceof Blob?data:new Blob([data],{type:mime});
    var u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000); status("If the download did not start, this website may block downloads from embedded tools. Use \u2018Show as text to copy\u2019 instead.");
  });
}
function loadScript(src){ return new Promise(function(res,rej){ if(document.querySelector('script[src="'+src+'"]')) return res(); var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=function(){rej(new Error("load"));}; document.head.appendChild(s); }); }
var JSPDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
var H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
function fname(ext){ return ((A.project||"ai-archive").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase()||"ai-archive")+(A.discussed==="not"?"-discussion-pack.":"-brief.")+ext; }

function textPDF(B){
  var jsPDF=window.jspdf.jsPDF, doc=new jsPDF({unit:"mm",format:"a4"}), M=18, W=210-2*M, y=M;
  function ensure(h){ if(y+h>297-M-6){ doc.addPage(); y=M; } }
  function txt(s,size,style,indent,after,color){
    indent=indent||0; doc.setFont("helvetica",style||"normal"); doc.setFontSize(size); doc.setTextColor(color||"#17211E");
    var lh=size*0.3528*1.4, lines=doc.splitTextToSize(String(s),W-indent);
    lines.forEach(function(l){ ensure(lh); doc.text(l,M+indent,y+lh*0.75); y+=lh; });
    y+=after==null?1.5:after;
  }
  function item(prefix,s,indent,boldLead){
    var size=10.5, lh=size*0.3528*1.4; ensure(lh);
    doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.text(prefix,M+indent,y+lh*0.75);
    if(boldLead){ txt(boldLead,size,"bold",indent+6,0.5); }
    txt(s,size,"normal",indent+6,1.8);
  }
  txt(B.title,20,"bold",0,1); txt(B.subtitle,13,"normal",0,3,"#1D5A52");
  B.meta.forEach(function(m){ txt(m[0]+": "+m[1],10,"normal",0,0.5,"#4E5D58"); }); y+=3;
  B.sections.forEach(function(s){
    ensure(16); y+=3; txt(s.h,13.5,"bold",0,1); doc.setDrawColor("#CBD5D0"); doc.line(M,y,M+W,y); y+=3;
    s.blocks.forEach(function(b){
      if(b.t==="p") txt(b.x,10.5,"normal",0,2.5);
      else if(b.t==="h4") { y+=1; txt(b.x,11,"bold",0,1); }
      else if(b.t==="ul") b.items.forEach(function(i){ item("-",i,1); });
      else if(b.t==="kv") b.items.forEach(function(i){ txt(i[0]+": "+i[1],10.5,"normal",0,1.2); });
      else if(b.t==="ol") b.items.forEach(function(i,k){
        item((k+1)+".", i.x||"", 0, i.b);
        if(i.list) i.list.forEach(function(l){ item("-",l,7); });
      });
    });
  });
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){ doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor("#4E5D58");
    doc.text(B.footer,M,297-10,{maxWidth:W-25}); doc.text("Page "+p+" of "+n,210-M,297-10,{align:"right"}); }
  return doc.output("blob");
}
function imagePDF(){
  return loadScript(H2C).then(function(){
    var box=document.createElement("div");
    box.style.cssText="position:fixed;left:-10000px;top:0;width:760px;padding:48px;background:#fff;color:#17211E;font:15px/1.55 'Atkinson Hyperlegible',Arial,sans-serif";
    box.className="sheet"; box.innerHTML=document.getElementById("sheet").innerHTML; document.body.appendChild(box);
    return window.html2canvas(box,{scale:2,backgroundColor:"#ffffff"}).then(function(c){
      box.remove();
      var jsPDF=window.jspdf.jsPDF, doc=new jsPDF({unit:"mm",format:"a4"}), pageH=Math.floor(c.width*297/210), off=0, first=true;
      while(off<c.height){
        var h=Math.min(pageH,c.height-off), pc=document.createElement("canvas"); pc.width=c.width; pc.height=pageH;
        var ctx=pc.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,pc.width,pc.height); ctx.drawImage(c,0,off,c.width,h,0,0,c.width,h);
        if(!first) doc.addPage(); first=false;
        doc.addImage(pc.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297); off+=pageH;
      }
      return doc.output("blob");
    });
  });
}
function doPDF(btn){
  btn.disabled=true; status("Preparing PDF\u2026");
  var B=buildBrief(), needImg=/[^\x00-\xFF]/.test(JSON.stringify(B));
  loadScript(JSPDF).then(function(){ return needImg?imagePDF():textPDF(B); })
   .then(function(blob){ return saveFile(fname("pdf"),blob,"application/pdf"); })
   .catch(function(){ status("The PDF could not be created (the PDF library may not have loaded). Try the editable text download instead."); })
   .then(function(){ btn.disabled=false; });
}

/* ---------- Events ---------- */
app.addEventListener("change",function(e){
  var t=e.target; if(!t.name) return;
  var q=Q(t.name); if(!q) return;
  if(q.type==="multi"){ A[q.id]=[].slice.call(app.querySelectorAll('input[name="'+q.id+'"]:checked')).map(function(i){return i.value;}); }
  else if(q.type==="single"){ A[q.id]=t.value; }
  save(); refreshStep();
});
app.addEventListener("input",function(e){ var t=e.target; if(t.type==="text"&&t.name){ A[t.name]=t.value; save(); } });
app.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var go=b.getAttribute("data-go"), act=b.getAttribute("data-act");
  if(go!=null){ if(go==="results"){view="results";} else {view="step"; stepIdx=+go;} render(true); return; }
  if(act==="start"||act==="resume"){ view="step"; stepIdx=0; render(true); }
  else if(act==="restart"){ if(!hasAnswers()||confirm("Clear all answers and start again?")){ clearAll(); view="step"; stepIdx=0; render(true); } }
  else if(act==="back"){ if(stepIdx===0) view="intro"; else stepIdx--; render(true); }
  else if(act==="next"){ if(stepIdx<act().length-1) stepIdx++; else view="results"; render(true); }
  else if(act==="edit"){ view="step"; stepIdx=0; render(true); }
  else if(act==="pdf") doPDF(b);
  else if(act==="showtext"){ var tb=document.getElementById("textbox"), ta=document.getElementById("bt"); ta.value=briefMD(buildBrief()); tb.hidden=false; ta.focus(); ta.select(); }
  else if(act==="md") saveFile(fname("md"),briefMD(buildBrief()),"text/markdown");
});

load(); getDL(); render(false);
})();
</script>
