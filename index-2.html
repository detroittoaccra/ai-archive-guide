<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Using AI for a Community Archive: Decision Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#17211E; --muted:#4E5D58; --line:#CBD5D0;
  --accent:#1D5A52; --accent-ink:#FFFFFF; --accent-soft:#DCEBE7; --ochre:#9A6A12;
  --go:#2E7A4C; --go-soft:#E0F0E6; --wait:#9A6400; --wait-soft:#FBF0D9; --stop:#A93A28; --stop-soft:#F8E3DE;
  --focus:#9A6A12;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A18; --surface:#1A2522; --ink:#E4ECE8; --muted:#A5B5AF; --line:#324440;
    --accent:#73BDB0; --accent-ink:#0E1A17; --accent-soft:#1F3833; --ochre:#E0B25A;
    --go:#6FCB93; --go-soft:#1C3325; --wait:#E8B24F; --wait-soft:#3A2F17; --stop:#F08A74; --stop-soft:#3D221C;
    --focus:#E0B25A;
  }
}
:root[data-theme="dark"]{
  --bg:#121A18; --surface:#1A2522; --ink:#E4ECE8; --muted:#A5B5AF; --line:#324440;
  --accent:#73BDB0; --accent-ink:#0E1A17; --accent-soft:#1F3833; --ochre:#E0B25A;
  --go:#6FCB93; --go-soft:#1C3325; --wait:#E8B24F; --wait-soft:#3A2F17; --stop:#F08A74; --stop-soft:#3D221C;
  --focus:#E0B25A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:1.0625rem;line-height:1.6}
.wrap{max-width:44rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1,h2,h3{line-height:1.2;margin:0 0 .6em}
h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.01em;max-width:18ch}
h2{font-size:clamp(1.5rem,4vw,2rem)}
h3{font-size:1.2rem;margin-top:1.8em}
p{margin:0 0 1em}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.lead{font-size:1.2rem;color:var(--muted);max-width:36rem}
.muted{color:var(--muted)}
.small{font-size:.92rem}

/* Trail (step path) */
.trail-box{overflow-x:auto;margin:0 -1.25rem 1.75rem;padding:0 1.25rem}
.trail{display:flex;list-style:none;margin:0;padding:.25rem 0;min-width:max-content}
.trail li{position:relative;flex:1 0 auto}
.trail li+li::before{content:"";position:absolute;top:1.05rem;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.trail li.done+li::before,.trail li.done.cur::before{background:var(--accent)}
.trail button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;
  background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;padding:0 .7rem;cursor:pointer;min-width:5.2rem}
.trail .node{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:3px solid var(--line);font-weight:700;font-size:.9rem;color:var(--muted)}
.trail li.done .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trail li.cur .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.trail li.cur button{color:var(--ink);font-weight:700}

/* Intro */
.hero{padding:1rem 0 1.5rem}
.lightkey{margin:1.5rem 0 0;padding:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lightkey h3{font-size:1.2rem;margin:0 0 .4rem}
.lightkey>p{margin:0 0 1rem;color:var(--muted)}
.lightkey ul{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.lightkey li{display:grid;grid-template-columns:1.6rem 1fr;gap:.75rem;align-items:start}
.lightkey .dot{width:1.6rem;height:1.6rem;border-radius:50%;margin-top:.1rem;border:2px solid var(--ink)}
.lightkey .dot.green{background:#3FB36A}.lightkey .dot.yellow{background:#F2C230}.lightkey .dot.red{background:#E0583F}
.lightkey li p{margin:0}
.facts{display:grid;gap:0;margin:2rem 0;border-top:2px solid var(--ink)}
.fact{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.fact h3{margin:0;font-size:1.05rem}
.fact p{margin:0}
@media (max-width:560px){.fact{grid-template-columns:1fr;gap:.25rem}}
.habits{margin:.5rem 0 0;padding-left:1.2rem}
.habits li{margin:.2rem 0}
.how{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem 1.25rem .5rem;margin:2rem 0}
.how ol{padding-left:1.3rem;margin:.5rem 0 1rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin:1.5rem 0}
.btn{appearance:none;font:inherit;font-weight:700;font-size:1rem;padding:.8rem 1.35rem;border-radius:8px;cursor:pointer;
  border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;padding-left:.4rem;padding-right:.4rem}
.btns .saved-note,.btns .confirm-q{flex-basis:100%;margin:0}
.btns .confirm-q{font-weight:700}
.btn:disabled{opacity:.5;cursor:default}

/* Questions */
.count{color:var(--muted);font-size:.95rem;margin-bottom:.3rem}
.q{margin:2rem 0 0;padding-top:1.5rem;border-top:1px solid var(--line)}
.q[hidden]{display:none}
.q.follow{margin-top:1rem;padding:1rem 1rem .25rem;border:0;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.qlabel{display:block;font-weight:700;font-size:1.15rem;margin-bottom:.6rem;padding:0;line-height:1.35}
.qhint{color:var(--muted);font-size:.95rem;margin:-.3rem 0 .6rem}
details.why{margin:0 0 .8rem;font-size:.95rem}
details.why summary{cursor:pointer;color:var(--accent);font-weight:700;width:max-content;max-width:100%}
details.why p{margin:.5rem 0 0;padding:.75rem 1rem;background:var(--accent-soft);border-radius:8px}
.learn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.learn h3{margin:0 0 .5rem;font-size:1.3rem}
.learn p{margin:0 0 .6rem}
.learn .ex{color:var(--muted);font-style:italic}
.learn .odds{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .8rem;padding:0;list-style:none}
.learn .odds li{font-size:.88rem;padding:.25rem .6rem;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.learn .odds b{font-weight:700}
.learn h4{margin:.6rem 0 .2rem;font-size:1rem}
.learn ul.reduce{margin:0;padding-left:1.2rem}
.learn ul.reduce li{margin:.2rem 0}
.catlist{margin:0 0 1rem;padding:.75rem 1rem .75rem 2.4rem;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.catlist li{margin:.25rem 0}
.subhead{font-size:1.45rem;margin:.5rem 0 .4rem}
.q.follow .subhead{font-size:1.2rem}
#needAns{margin-top:1.5rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;padding:.8rem 1rem;background:var(--surface);
  border:2px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:1.3rem;height:1.3rem;margin:.15rem 0 0;flex:none;accent-color:var(--accent)}
.opt .ol{display:flex;flex-direction:column}
.opt .note{color:var(--muted);font-size:.9rem;margin-top:.15rem}
input[type=text]{width:100%;font:inherit;padding:.75rem .9rem;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:48px}
input[type=text]:focus{border-color:var(--accent)}
.flags:empty{display:none}
.flags{margin-top:.75rem;display:grid;gap:.5rem}
.flag{padding:.7rem 1rem;border-radius:8px;border-left:5px solid;font-size:.97rem}
.flag b{display:block;margin-bottom:.1rem}
.flag.stop{background:var(--stop-soft);border-color:var(--stop)}
.flag.caution{background:var(--wait-soft);border-color:var(--wait)}
.flag.ok{background:var(--go-soft);border-color:var(--go)}
.navrow{display:flex;justify-content:space-between;gap:.75rem;margin-top:2.5rem;padding-top:1.25rem;border-top:2px solid var(--ink)}

/* Results */
.verdict{margin:1rem 0 2rem;padding:1.5rem;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.stages{display:flex;gap:.4rem;list-style:none;margin:0 0 1rem;padding:0}
.stages li{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;padding:.4rem .5rem;border:2px solid var(--line);border-radius:999px;font-size:.9rem;font-weight:700;color:var(--muted)}
.stages li.done{border-color:var(--accent);color:var(--accent)}
.stages li.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.verdict h2{margin:0 0 .3rem}
.verdict p{margin:0}
.issue-list{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.5rem}
.sheet-box{margin-top:1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:32rem;overflow:auto}
.sheet{padding:1.5rem;font-size:.95rem}
.sheet h1{font-size:1.5rem;max-width:none}
.sheet h2{font-size:1.15rem;margin-top:1.6em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.sheet h4{margin:.9em 0 .2em;font-size:1rem}
.sheet ul,.sheet ol{padding-left:1.3rem}
.sheet li{margin:.25rem 0}
.sheet dl{display:grid;grid-template-columns:minmax(9rem,max-content) 1fr;gap:.2rem 1rem;margin:0}
.sheet dt{font-weight:700}
.sheet dd{margin:0}
.status{min-height:1.5em;font-size:.95rem;color:var(--muted)}
.foot{margin-top:3rem;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem}
@media (prefers-reduced-motion:no-preference){
  .stages li.on{animation:glow .6s ease-out 1}
  @keyframes glow{from{opacity:.4;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
}
@media print{
  body{background:#fff;color:#000}
  .trail-box,.btns,.navrow,.status,.foot{display:none}
  .sheet-box{max-height:none;border:0}
}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="off"></main>

<script>
(function(){
"use strict";

/* ---------- Content: steps and questions ---------- */
function taskAny(a,l){ var t=a.tasks||[], real=t.filter(function(x){return x!=="advice";});
  if(!real.length||t.indexOf("advice")>-1) return true; return l.some(function(x){return t.indexOf(x)>-1;}); }
function noAI(){ return A.discussed==="against"; }
function lightKeyHTML(){
  return '<div class="lightkey"><h3>Green, yellow and red light</h3><p>'+esc(noAI()?"Sort material by who may see it. The rest of the guide uses these three levels.":LIGHTS_NOTE)+'</p><ul>'+
    LIGHTS.map(function(L){return '<li><span class="dot '+L.k+'" aria-hidden="true"></span><p><b>'+esc(L.name)+'.</b> '+esc(L.what)+(noAI()?'':' '+esc(L.rule))+'</p></li>';}).join("")+'</ul></div>';
}
function T(x,alt){ return noAI()&&alt?alt:x; }
function notAgainst(a){ return a.discussed!=="against"; }
function fullPath(a){ return a.discussed!=="against"&&a.discussed!=="not"; }
function topic(id,title,L,na,show){
  var o=[{v:"ok",l:"We understand this and are accepting the risk"},
         {v:"discuss",l:"We need to discuss this more",flag:["caution","Discuss '"+title+"' as a group before starting."]}];
  if(na) o.push({v:"na",l:na});
  return {id:id,type:"single",topicTitle:title,learn:L,show:show,label:"Where does your group stand on this?",opts:o};
}
var LIGHTS = [
  {k:"green", name:"Green light", what:"Already public.", rule:"May be used with AI tools, including free accounts with training switched off, as long as a person checks every result."},
  {k:"yellow", name:"Yellow light", what:"For the community only.", rule:"May go into AI only if the community agrees, and only with tools on your own computers or services with a written promise not to train on it. Never with free or personal accounts."},
  {k:"red", name:"Red light", what:"Restricted, sacred or sensitive: including personal information about living people, locations of sacred sites or graves, land and legal matters, and material about children.", rule:"Never goes into any AI tool. Handled by people only, under community protocols."}];
var LIGHTS_NOTE = "Sort material into green, yellow and red light by who may see it. The colour decides what AI may touch.";
var CHECKED = "September 2026";
/* ---------- Risks and limits, placed under the task they belong to ---------- */
var TOPICS={};
[
topic("r_halluc","Made-up content (hallucinations)",{means:"AI states false things confidently, with no warning.",ex:"A summary says an elder was born in a village she never lived in; a translation invents the meaning of a ceremony.",odds:["Almost certain on any large job","Rare to reach the archive","Medium to high: false facts can last for generations"],reduce:["A knowledgeable community member checks every output before it is saved.","Label AI-made text clearly so mistakes are not taken as fact."]}),
topic("r_leak","Leaks and exposure",{means:"Private or sacred material ends up where it should not. This usually happens through human error, not hacking.",ex:"Someone pastes a restricted recording into a free online AI tool, or a search tool shows restricted items to the public.",odds:["Possible","Low","High for sacred or personal material"],reduce:["Agree clear rules on what may be uploaded, and by whom.","Use offline or local tools for anything sensitive.","A simple rule: if you would not post it on a public noticeboard, do not put it into a public AI tool."]}),
topic("r_train","Your material used to train AI",{means:"The company keeps your material and uses it to build its products.",ex:"Your language or stories end up inside a commercial AI product.",odds:["Likely on many free tools","Low","High for cultural and language material"],reduce:["On most free and personal accounts, chats can be used for training unless you switch it off. Before uploading anything, turn off settings such as 'Improve the model for everyone' (ChatGPT), 'Help improve Claude' (Claude) or 'Keep Activity' (Gemini).","Switching it off protects future chats only, not past ones, and every person's account must be changed separately.","Do not press thumbs up, thumbs down or other feedback buttons on chats that contain archive material. On several services, a chat you give feedback on can be kept and used for training even when training is switched off.","Setting names last checked: "+CHECKED+". Companies rename and move these settings, so confirm them before you rely on this list.","Business, education, nonprofit and developer (API) accounts often do not train on your data by default. Check the terms, and recheck regularly, because companies change them."]}),
topic("r_bias","Bias and misrepresentation",{means:"AI repeats outside or colonial views of your community.",ex:"Photos labelled with offensive historic terms, or your people described as 'extinct'.",odds:["Likely","Low","Medium: hurtful and misleading"],reduce:["People review every description.","Use your community's own words and labels."]},null,function(a){return taskAny(a,["describe","summarise","translate","search"]);}),
topic("r_meaning","Loss of meaning and protocols",{means:"Stories are reduced to keywords, and cultural rules are ignored.",ex:"Seasonal or gender-restricted knowledge becomes searchable by anyone.",odds:["Likely","Low","Medium to high for restricted knowledge"],reduce:["Knowledge holders decide what AI may touch.","Record protocols alongside each item."]},null,function(a){return taskAny(a,["describe","summarise","translate","search"])||a.protocols==="written"||a.protocols==="unwritten";}),
topic("r_control","Ownership, dependency and cost",{means:"You cannot get your material back, or the archive only works while a company's tool exists and you can pay for it.",ex:"Prices rise, a free version ends, or the company closes.",odds:["Likely within 3 to 5 years","Still likely, but harmless if prepared","Low if you keep your own copies"],reduce:["Keep your own full copies of originals.","Use open file formats, and make sure the archive works without AI.","Get written agreements on ownership, deletion and where material is stored."]}),
topic("r_harm","Surveillance and harm",{means:"Information is used against community members.",ex:"Locations of sacred sites, land claims or activists become easy to find.",odds:["Unlikely","Very low","Very high"],reduce:["Keep red-light material out of AI entirely.","Think about who might want this information, and why."]},null,function(a){return taskAny(a,["search","website"])||(a.sensitive||[]).some(function(x){return ["sacred","personal","locations","legal","children"].indexOf(x)>-1;});}),
topic("e_context","Limited memory (context drop)",{means:"AI can only hold a certain amount of material in mind at once. With long material it forgets or skims parts, often the middle.",ex:"A summary of a three-hour oral history leaves out the most important story.",reduce:["Break long recordings and documents into shorter pieces.","Check summaries against the full item."]},null,function(a){return taskAny(a,["transcribe","summarise","search","translate","ocr"]);}),
topic("e_lang","Language gaps and errors that add up",{means:"AI learns mostly from English and a few big languages. When text is generated in stages (transcribe, then translate, then summarise), each stage adds its own mistakes.",ex:"By the end of the chain, the meaning of a story may be badly wrong, with invented details that look like fact.",reduce:["Test each language on a sample.","Check each stage before starting the next.","Budget for human correction."]},null,function(a){return taskAny(a,["transcribe","translate","ocr","summarise"]);}),
topic("e_collapse","Model collapse",{means:"When AI learns from content that other AI produced, its quality slowly gets worse. Rare words, dialects and unusual stories fade first.",ex:"If unchecked AI text fills the archive, future tools trained on it inherit and magnify the errors.",reduce:["Keep human-made and AI-made content clearly separate and labelled.","Never treat unchecked AI text as the original record."]},null,function(a){return taskAny(a,["transcribe","ocr","translate","describe","summarise","search"]);}),
topic("e_change","Inconsistency, changing tools and over-trust",{means:"The same question can get different answers; companies update tools without warning; AI rarely says 'I don't know'. People also tend to trust computers too much, especially when busy.",ex:"A process that worked last year gives different results now, and reviewers stop checking carefully after a few good results.",reduce:["Test on 10 to 20 items you know well: advertised accuracy may not apply to your material.","Retest after updates and at each community review.","Rotate reviewers or take breaks so checking stays careful."]}),
topic("e_long","Long projects that go beyond a single chat",{means:"Chat tools usually do not remember earlier conversations, and long chats lose track of details from the start.",ex:"Naming rules or access decisions agreed in March are ignored in May.",reduce:["Keep your own written record of key decisions and instructions, and share it at the start of each session.","Do not rely on chat history as your only record of the work.","For technical work, agentic tools (such as Claude Code or Codex) can keep track across sessions, but they change files directly. Use them only on a copy, with backups, never on folders with restricted material, and with someone who can review their changes."]},"Not relevant: our use will be short, one-off tasks"),
topic("e_web","Using AI to build or fix the website",{means:"AI can expose passwords or personal data pasted into it, and its quick fixes can weaken security or make restricted material public.",ex:"A 'permission denied' error is 'fixed' by making every folder open to everyone.",reduce:["Remove passwords, keys and personal details before pasting anything.","Test changes on a copy of the site, with a recent backup.","Have a person review any change affecting logins or who can see what.","After changes, check the site as a visitor, a community member and an admin."]},null,function(a){return taskAny(a,["website"]);}),
topic("e_env","Environmental cost",{means:"AI runs in data centres that use electricity and water. For a community archive the impact is usually modest, and your choices make a real difference.",ex:"Costs are highest with very large tools, image or video generation, and re-running the same task. Some data centres are in water-scarce regions, including in the Global South.",reduce:["Use smaller tools, and run them locally where possible.","Do each task once, well, and work in batches.","Skip AI images and video unless they serve a clear purpose.","Ask providers about their energy and water use."]})
].forEach(function(t){ TOPICS[t.id]=t; });
function groupOn(a,g){ return fullPath(a)&&(has(a.tasks,"advice")||g.tasks.some(function(t){return has(a.tasks,t);})); }
var TASK_GROUPS=[
  {id:"t_lang", title:"Transcription, scanned text and translation", short:"Language", tasks:["transcribe","ocr","translate"],
   intro:"These risks come with transcription, reading scanned documents and translation.",
   extra:[  {id:"langType", type:"single", show:function(a){return has(a.tasks,"transcribe")||has(a.tasks,"translate")||has(a.tasks,"ocr");},
    label:"What languages are represented in your collection?",
    hint:function(a){ return a.languages&&a.languages.trim()?"You listed: "+a.languages.trim()+". Choose the description that fits best.":"Choose the description that fits best."; },
    why:"AI tools learn mostly from English and a few other widely spoken languages. The fewer speakers a language has online, the more errors to expect, and some languages are not supported at all.",
    opts:[
    {v:"major", l:"Mostly major world languages (English, Spanish, French and similar)"},
    {v:"regional", l:"Regional or national languages with fewer speakers", flag:["caution","Expect more errors. Test on a sample before committing."]},
    {v:"minority", l:"Indigenous or minority languages", flag:["caution","Expect high error rates, or no support at all. Test on a sample and plan for heavy human correction. Decide who will own any language tools that result."]},
    {v:"mixed", l:"A mix", flag:["caution","Test each language separately; accuracy will vary a lot."]}]}], topics:["e_lang","e_context"]},
  {id:"t_desc", title:"Descriptions and summaries", short:"Describing", tasks:["describe","summarise"],
   intro:"These risks come with descriptions, tags and summaries.",
   topics:["r_bias","r_meaning","e_context","e_lang","e_collapse"]},
  {id:"t_search", title:"Search tool or chatbot", short:"Search", tasks:["search"],
   intro:"This is the highest-risk task, because it can show material to people who should not see it.",
   extra:[  {id:"searchScope", type:"single", show:function(a){return has(a.tasks,"search");},
    label:"What should a search tool or chatbot be allowed to draw on?", opts:[
    {v:"public", l:"Only green-light (already public) material"},
    {v:"community", l:"Green- and yellow-light material, behind a login with access checks", flag:["caution","Access levels must be enforced every time the tool looks something up, not just on the files."]},
    {v:"all", l:"Everything in the archive", flag:["stop","A chatbot that can read everything can reveal restricted items in its answers, even when the files themselves are locked. Limit it to green-light material, or yellow-light material behind access checks."]}]}], topics:["r_harm","r_meaning","r_bias","e_context","e_collapse"]},
  {id:"t_web", title:"Website work", short:"Website", tasks:["website"],
   intro:"These risks come with using AI on the archive website.",
   topics:["e_web","r_harm"]}
];
var SHARED_TOPICS=["r_halluc","r_leak","r_train","r_control","r_harm","e_collapse","e_change","e_long","e_env","r_bias","r_meaning","e_context","e_lang"];
var AGENT_Q={id:"agentUse", type:"single", show:fullPath,
  label:"Will anyone use agentic tools (such as Claude Code or Codex) that change files directly?", opts:[
  {v:"no", l:"No"},

function analyse(){

  allQs().forEach(function(q){ if(!visible(q)) return; selectedFlags(q).forEach(function(f){ if(q.id==="discussed"&&f.lvl==="stop") return; if(f.lvl==="stop") stops.push(f); else if(f.lvl==="caution") cautions.push(f); }); });

    cautions.push({lvl:"caution",text:"The search tool is set to draw on more material than you allowed for AI tools in general. Limit it to "+(A.aiLights==="g"?"green-light material only":"green- and yellow-light material, behind access checks")+", or change the general limit.",q:Q("searchScope")});
  if(visible(Q("aiLights"))&&A.aiLights==="gy"&&visible(Q("account"))&&A.account==="personal")
    cautions.push({lvl:"caution",text:"Yellow-light material should not go into free or personal accounts. Use tools on your own computers or a service with a written no-training agreement, or limit AI to green-light material.",q:Q("account")});
  var v;
  if(A.discussed==="against") v="decided";
  else if(A.discussed==="not") v="prepare";
  else if(stops.length) v="notyet";
  else if(A.tested==="good"&&!cautions.length&&A.discussed==="agreed") v="expand";
  else v="trial";
  return {v:v,stops:stops,cautions:cautions};
}

var JSPDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
var H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
function fname(ext){ return ((A.project||"ai-archive").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase()||"ai-archive")+(A.discussed==="not"?"-discussion-pack.":"-brief.")+ext; }

function textPDF(B){
  var jsPDF=window.jspdf.jsPDF, doc=new jsPDF({unit:"mm",format:"a4"}), M=18, W=210-2*M, y=M;
  function ensure(h){ if(y+h>297-M-6){ doc.addPage(); y=M; } }
  function txt(s,size,style,indent,after,color){
    indent=indent||0; doc.setFont("helvetica",style||"normal"); doc.setFontSize(size); doc.setTextColor(color||"#17211E");
    var lh=size*0.3528*1.4, lines=doc.splitTextToSize(String(s),W-indent);
    lines.forEach(function(l){ ensure(lh); doc.text(l,M+indent,y+lh*0.75); y+=lh; });
    y+=after==null?1.5:after;
  }
  function item(prefix,s,indent,boldLead){
    var size=10.5, lh=size*0.3528*1.4; ensure(lh);
    doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.text(prefix,M+indent,y+lh*0.75);
    if(boldLead){ txt(boldLead,size,"bold",indent+6,0.5); }
    txt(s,size,"normal",indent+6,1.8);
  }
  txt(B.title,20,"bold",0,1); txt(B.subtitle,13,"normal",0,3,"#1D5A52");
  B.meta.forEach(function(m){ txt(m[0]+": "+m[1],10,"normal",0,0.5,"#4E5D58"); }); y+=3;
  B.sections.forEach(function(s){
    ensure(16); y+=3; txt(s.h,13.5,"bold",0,1); doc.setDrawColor("#CBD5D0"); doc.line(M,y,M+W,y); y+=3;
    s.blocks.forEach(function(b){
      if(b.t==="p") txt(b.x,10.5,"normal",0,2.5);
      else if(b.t==="h4") { y+=1; txt(b.x,11,"bold",0,1); }
      else if(b.t==="ul") b.items.forEach(function(i){ item("-",i,1); });
      else if(b.t==="kv") b.items.forEach(function(i){ txt(i[0]+": "+i[1],10.5,"normal",0,1.2); });
      else if(b.t==="ol") b.items.forEach(function(i,k){
        item((k+1)+".", i.x||"", 0, i.b);
        if(i.list) i.list.forEach(function(l){ item("-",l,7); });
      });
    });
  });
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){ doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor("#4E5D58");
    doc.text(B.footer,M,297-10,{maxWidth:W-25}); doc.text("Page "+p+" of "+n,210-M,297-10,{align:"right"}); }
  return doc.output("blob");
}
function imagePDF(){
  return loadScript(H2C).then(function(){
    var box=document.createElement("div");
    box.style.cssText="position:fixed;left:-10000px;top:0;width:760px;padding:48px;background:#fff;color:#17211E;font:15px/1.55 'Atkinson Hyperlegible',Arial,sans-serif";
    box.className="sheet"; box.innerHTML=document.getElementById("sheet").innerHTML; document.body.appendChild(box);
    return window.html2canvas(box,{scale:2,backgroundColor:"#ffffff"}).then(function(c){
      box.remove();
      var jsPDF=window.jspdf.jsPDF, doc=new jsPDF({unit:"mm",format:"a4"}), pageH=Math.floor(c.width*297/210), off=0, first=true;
      while(off<c.height){
        var h=Math.min(pageH,c.height-off), pc=document.createElement("canvas"); pc.width=c.width; pc.height=pageH;
        var ctx=pc.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,pc.width,pc.height); ctx.drawImage(c,0,off,c.width,h,0,0,c.width,h);
        if(!first) doc.addPage(); first=false;
        doc.addImage(pc.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297); off+=pageH;
      }
      return doc.output("blob");
    });
  });
}
function doPDF(btn){
  btn.disabled=true; status("Preparing PDF\u2026");
  var B=buildBrief(), needImg=/[^\x00-\xFF]/.test(JSON.stringify(B));
  loadScript(JSPDF).then(function(){ return needImg?imagePDF():textPDF(B); })
   .then(function(blob){ return saveFile(fname("pdf"),blob,"application/pdf"); })
   .catch(function(){ status("The PDF could not be created (the PDF library may not have loaded). Try the editable text download instead."); })
   .then(function(){ btn.disabled=false; });
}

/* ---------- Events ---------- */
app.addEventListener("change",function(e){
  var t=e.target; if(!t.name) return;
  var q=DKMAP[t.name]||Q(t.name); if(!q) return;
  var need=document.getElementById("needAns"); if(need) need.remove();
  if(q.type==="multi"){ A[q.id]=[].slice.call(app.querySelectorAll('input[name="'+DK(q)+'"]:checked')).map(function(i){return i.value;}); }
  else if(q.type==="single"){ A[q.id]=t.value; }
  save(); refreshStep();
});
app.addEventListener("input",function(e){ var t=e.target; if(t.type==="text"&&t.name){ A[t.name]=t.value; save(); } });
app.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var go=b.getAttribute("data-go"), act=b.getAttribute("data-act");
  if(go!=null){
    var steps=STEPS.filter(stepOn), target=go==="results"?steps.length:+go; /* not act(): shadowed by the local "act" above */
    for(var j=0;j<target&&j<steps.length;j++){ var m=missingRisks(steps[j]); if(m.length){ view="step"; stepIdx=j; render(true); showNeed(m); return; } }
    if(go==="results"){view="results";} else {view="step"; stepIdx=+go;} render(true); return; }
  if(act==="start"||act==="resume"){ view="step"; stepIdx=0; render(true); }
  else if(act==="restart"){
    if(!hasAnswers()){ view="step"; stepIdx=0; render(true); return; }
    var box=b.closest(".btns");
    box.innerHTML='<p class="confirm-q" role="alert">Clear all answers saved in this browser and start over? This cannot be undone.</p>'+
      '<button class="btn" data-act="restartYes">Clear answers</button><button class="btn ghost" data-act="restartNo">Keep my answers</button>';
    box.querySelector('[data-act=restartNo]').focus();
  }
  else if(act==="restartYes"){ clearAll(); view="step"; stepIdx=0; render(true); }
  else if(act==="restartNo"){ render(true); }
  else if(act==="back"){ if(stepIdx===0) view="intro"; else stepIdx--; render(true); }
  else if(act==="next"){
    var miss=missingRisks(curStep); if(miss.length){ showNeed(miss); return; }
    if(stepIdx<STEPS.filter(stepOn).length-1) stepIdx++; else view="results"; render(true); }
  else if(act==="edit"){ view="step"; stepIdx=0; render(true); }
  else if(act==="pdf") doPDF(b);
  else if(act==="showtext"){ var tbx=document.getElementById("textbox"), ta=document.getElementById("bt"); ta.value=briefMD(buildBrief()); tbx.hidden=false; ta.focus(); ta.select(); }
  else if(act==="md") saveFile(fname("md"),briefMD(buildBrief()),"text/markdown");
});

load(); getDL(); render(false);
})();
</script>
